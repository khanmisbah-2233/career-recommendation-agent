[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-recommendation-agent"
version = "0.1.0"
description = "Offline AI-style career recommendation engine for matching profiles to provided job listings."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "AI Career Recommendation Agent" }
]
dependencies = [
  "fastapi>=0.115.0,<1.0",
  "langgraph>=0.2.0,<1.0",
  "langchain-groq>=0.2.0,<1.0",
  "pydantic>=2.7,<3.0",
  "pypdf>=5.0.0,<7.0",
  "pymupdf>=1.24.0,<2.0",
  "pytesseract>=0.3.10,<1.0",
  "psycopg[binary]>=3.2.0,<4.0",
  "python-dotenv>=1.0.0,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "uvicorn[standard]>=0.30.0,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0"
]

[project.scripts]
career-recommend = "career_recommendation_agent.cli:main"
career-web = "career_recommendation_agent.web_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
